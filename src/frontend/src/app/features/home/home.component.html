<app-header></app-header>

<div class="content">
  <h2>Produtos em Destaque</h2>
  
  <div class="product-grid" *ngIf="products$ | async as products; else loading">
    <app-product-card 
      *ngFor="let product of products" 
      [product]="product">
    </app-product-card>
  </div>

  <ng-template #loading>
    <div class="loader">Buscando produtos no servidor...</div>
  </ng-template>
</div>
