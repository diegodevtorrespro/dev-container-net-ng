<div class="page-container">
  <div class="products-grid" *ngIf="products$ | async as products; else loading">
    
    <app-product-card 
      *ngFor="let product of products" 
      [product]="product">
    </app-product-card>

  </div>

  <ng-template #loading>
    <div class="loading-container">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</div>
