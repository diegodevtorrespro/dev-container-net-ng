<mat-card class="product-card">
  <mat-card-header>
    <mat-card-title>{{ product.nome }}</mat-card-title>
    <mat-card-subtitle>{{ product.preco | currency:'BRL' }}</mat-card-subtitle>
  </mat-card-header>
  
  <img mat-card-image 
       [src]="product.image || 'assets/placeholder.png'" 
       [alt]="product.nome">
       
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="addToCart()">
      Adicionar ao Carrinho
    </button>
  </mat-card-actions>
</mat-card>
